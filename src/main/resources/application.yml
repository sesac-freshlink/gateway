# gateway 기본 설정. 실제 값은 환경 변수로 넣는다(클러스터에서는 gitops·ArgoCD가 넣는다).
# 프로필은 dev·prod 두 개. SPRING_PROFILES_ACTIVE로 고른다.
server:
  port: 8080

spring:
  application:
    name: gateway
  jackson:
    time-zone: Asia/Seoul         # 시각은 ISO-8601 +09:00
  cloud:
    gateway:
      server:
        webmvc:
          # 라우팅 표 (API 명세 'Gateway 라우팅' 시트, README 3장). 위에서부터 먼저 매칭한다.
          # 모든 라우트가 /api를 떼고 넘긴다(StripPrefix=1). /ops/**, /actuator/** 라우트는 만들지 않는다.
          # Idempotency-Key, Authorization 같은 다른 헤더는 그대로 넘긴다. 사용자 헤더는 UserHeaderFilter가 만든다.
          # SSE(점주 매출 /api/owner/orders/sales/stream, 2차 알림 /api/notifications/stream)는 따로 설정하지 않아도 된다.
          #  - 버퍼링: 응답이 text/event-stream이면 Gateway MVC가 받는 대로 바로 흘려보낸다(streaming-media-types 기본값).
          #  - 타임아웃: 서비스로 가는 HTTP 클라이언트에 읽기 타임아웃이 없다(spring.http.clients.read-timeout 미설정).
          #    이 값을 넣으면 SSE에도 걸리므로, 넣는다면 heartbeat(20초)보다 길게 둔다.
          #  끊김 기준은 CloudFront origin 응답 타임아웃 30초와 ALB 유휴 타임아웃 60초라 서비스가 20초마다 heartbeat를 보낸다.
          #  확인 테스트: GatewayApplicationTests.ownerSalesStream_notBuffered, notificationStream_notBuffered
          routes:
            - id: inventory-store-products          # 1. 공개. /api/stores보다 먼저
              uri: ${INVENTORY_SERVICE_URI:http://inventory-service:8080}
              predicates:
                - Path=/api/stores/{storeId}/products,/api/stores/{storeId}/products/{productId}
                - Method=GET
              filters:
                - StripPrefix=1
            - id: member-stores                     # 2. 공개
              uri: ${MEMBER_SERVICE_URI:http://member-service:8080}
              predicates:
                - Path=/api/stores,/api/stores/{storeId}   # 점포 검색·점포 상세
                - Method=GET
              filters:
                - StripPrefix=1
            - id: member-members                    # 3·4. nickname-availability만 공개, 나머지 로그인
              uri: ${MEMBER_SERVICE_URI:http://member-service:8080}
              predicates:
                - Path=/api/members/**
              filters:
                - StripPrefix=1
            - id: member-admin                      # 5. ADMIN
              uri: ${MEMBER_SERVICE_URI:http://member-service:8080}
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=1
            - id: inventory-owner                   # 6·7. OWNER
              uri: ${INVENTORY_SERVICE_URI:http://inventory-service:8080}
              predicates:
                - Path=/api/owner/inventory/**,/api/owner/disposals
              filters:
                - StripPrefix=1
            - id: order-owner                       # 8. OWNER
              uri: ${ORDER_SERVICE_URI:http://order-service:8080}
              predicates:
                - Path=/api/owner/orders/**         # 목록·픽업 확인·매출 (/api/owner/orders 자체도 포함)
              filters:
                - StripPrefix=1
            - id: order-orders                      # 9. CUSTOMER
              uri: ${ORDER_SERVICE_URI:http://order-service:8080}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
            - id: notification                      # 10. 로그인 (알림 목록·읽음·SSE·재입고 알림 신청)
              uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8080}
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1

# Cognito ID 토큰 검증 (README 'JWT 규칙'). 공개 키는 <issuer-uri>/.well-known/jwks.json에서 받아 캐시한다.
# 파드는 NAT를 거쳐 Cognito에 닿는다. 토큰 검증에 공유 비밀 키는 쓰지 않는다.
# BFF 로그인(README 'BFF 로그인')은 시크릿이 있는 bff 클라이언트로 gateway가 Cognito를 대신 부른다.
freshlink:
  cognito:
    issuer-uri: ${COGNITO_ISSUER_URI:}            # https://cognito-idp.ap-northeast-2.amazonaws.com/<UserPoolId>
    client-id: ${COGNITO_CLIENT_ID:}              # 토큰 aud와 같아야 한다 (dev는 bff, prod는 릴리스 때 bff)
    bff-client-id: ${COGNITO_BFF_CLIENT_ID:}      # 로그인·갱신·가입에 쓰는 bff 클라이언트
    client-secret: ${COGNITO_CLIENT_SECRET:}      # bff 클라이언트 시크릿. 파일·로그에 쓰지 않는다
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    domain-url: ${COGNITO_DOMAIN_URL:}            # 구글 로그인: https://freshlink-<env>-auth.auth.ap-northeast-2.amazoncognito.com
    region: ${AWS_REGION:ap-northeast-2}
    refresh-token-validity: 1d                    # fl_refresh·fl_uid 쿠키 만료. infra modules/cognito refresh_token_validity_days와 같게
  frontend-url: ${FRONTEND_URL:}                  # 구글 콜백 redirect_uri와 로그인 뒤 돌아갈 곳 (https://<id>.cloudfront.net)

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness
  # 추적(할 일 16). 요청마다 traceId를 만들어 로그에 넣고, 서비스로 넘길 때 traceparent 헤더를 붙인다.
  # PC에는 Zipkin이 없어서 보내지 않는다. 클러스터에서는 gitops 차트(spring-service)가 환경 변수로 켜고 주소를 넣는다:
  #   MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED=true, MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin.observability:9411/api/v2/spans
  # JSON 로그(LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs)도 차트가 넣는다. PC 로그는 사람이 읽는 형식 그대로다.
  tracing:
    sampling:
      probability: 1.0            # MVP는 요청이 적어 전부 기록
    export:
      zipkin:
        enabled: false

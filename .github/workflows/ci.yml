# CI (할 일 8). 실제 단계는 .github 레포의 재사용 워크플로 spring-build.yml에 있다.
# PR: 빌드·테스트만. dev push(또는 dev에서 수동 실행): ECR 이미지(태그 = 커밋 7자리) + gitops envs/dev 태그 커밋 → ArgoCD 배포
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  build:
    uses: sesac-freshlink/.github/.github/workflows/spring-build.yml@main
    secrets: inherit

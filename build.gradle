// gateway 빌드 설정. 팀 공통 기준: Java 21, Spring Boot 4.0.8, Gradle Wrapper 9.x.
// Spring Cloud Gateway WebMVC판(서블릿, 서비스 3개와 같은 바탕). 라우팅은 application.yml, 토큰 검증은 security 패키지.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.freshlink'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2025.1.3')   // Spring Boot 4.0.x 대응 Spring Cloud
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'    // 서블릿(WebMVC) Gateway
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server' // Cognito JWT 검증 (JWKS, RS256)
    implementation 'org.springframework.boot:spring-boot-starter-validation'                 // 설정 값(@NotBlank) 확인
    implementation 'org.springframework.boot:spring-boot-starter-actuator'                   // /actuator/health
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'                               // /actuator/prometheus

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}
